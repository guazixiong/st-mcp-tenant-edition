# ST-MCP 离线部署参数（本文件不得包含任何口令；口令放 secrets/st-mcp.env，权限 600）
# 修改后重新执行 install-all.sh 即生效。
#
# 这份文件是**主实例**的配置。三种常见场景：
#   A 本机现装一个神通库并连它  —— 就是本文件的默认值（ST_HOST=127.0.0.1 + INSTALL_SHENTONG=yes）
#   B 连一台已经装好的神通服务器 —— 改下面 4 个连接字段 + INSTALL_SHENTONG=no，然后 sh install-all.sh
#   C 一台机器同时连多个神通库   —— 每个库一个实例：sh scripts/new-instance.sh <名字> <库IP>
#      实例配置在 instances/<名字>.conf，主实例这份文件保持不动（见 instances/README.md）

# ---- 神通数据库连接 ----
# ST_HOST 就是"连哪个库"：127.0.0.1/localhost = 这台机器上装的库；
# 其它 IP/主机名 = 那台神通服务器（此时 ST_HOST_GATEWAY 用不上）。
ST_HOST=127.0.0.1
ST_PORT=2003
ST_USER=SYSDBA
ST_DB=OSRDB
# 容器内 127.0.0.1 指向容器自身；数据库装在宿主机时，入口脚本会把上面的
# localhost/127.0.0.1 重映射成该网关地址。
ST_HOST_GATEWAY=172.17.0.1

# ---- MCP 服务 ----
# sse              = 长连接 HTTP（端点 GET <MCP_PATH 之外的 /sse>）
# streamable-http  = 单端点 HTTP，新版客户端（含 Qoder/Claude Desktop 较新版本）用的就是它
# stdio            = 客户端直接拉起（本地调试用）
# 默认 streamable-http：只会讲 sse 的老客户端撞上来会得到 405，那种客户端建议
# 用 scripts/new-instance.sh 单独起一个 TRANSPORT=sse 的实例，不要把主实例改回去。
TRANSPORT=streamable-http
# streamable-http 的端点路径，客户端 URL 形如 http://<库机IP>:<HOST_PORT>/mcp
MCP_PATH=/mcp
SSE_HOST=0.0.0.0
SSE_PORT=8100
# restricted = 只读（拒绝写 SQL，30s 超时）；unrestricted = 可读写
ACCESS_MODE=unrestricted

# ---- 容器 ----
IMAGE_NAME=st-mcp
IMAGE_TAG=0.1.0
CONTAINER_NAME=st-mcp
# 端口映射：宿主机端口->容器端口
HOST_PORT=8100

# ---- 安装行为 ----
# build：用 images/ 里的基础镜像 + wheels/ 在本机离线构建 st-mcp 镜像（默认，推荐；
#        厂商的 STPython 轮子放进 wheels/ 后重跑即可打进镜像，全程不联网）
# load ：直接 load images/02-st-mcp-*.tar.gz（仅当你已把构建好的镜像归档进包时）
# auto ：有 STPython 轮子用 build，否则 load
IMAGE_MODE=build
# 本脚本是否顺带安装 vendor/ 下的神通数据库安装包（yes/no/auto）
# no   = 不碰数据库（上面 4 个连接字段填的就是那台库的地址，场景 B 用这个）
# auto = vendor/ 里有介质或本机已装好就顺带补齐，都没有就跳过并告警
# yes  = 执行装库流程；有介质就装，目标机已装好（$ST_INSTALL_PREFIX/bin/oscar 存在）
#        则不再跑 setup，只补建库/初始化/服务与驱动收割（默认，场景 A）
INSTALL_SHENTONG=yes
# 神通安装位置（装库时用；换路径就改这里）
ST_INSTALL_PREFIX=/opt/ShenTong
